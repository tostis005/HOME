name: Quality uplift HOME 071-150

on:
  push:
    branches:
      - quality-audit-071-150
    paths:
      - 'content/tools/quality-uplift-071-150.py'
      - '.github/workflows/quality-uplift-071-150.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uplift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python3 content/tools/quality-uplift-071-150.py

      - name: Validate full article inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          required={'schema_version','id','article_number','translation_group','language','locale','market_context','title','slug','seo','excerpt','taxonomy','content_html','faq','sources','image','status'}
          files=sorted(Path('content/articles').glob('*/*.json'))
          ids=set(); pairs=set()
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              missing=required-d.keys()
              if missing: raise SystemExit(f'{p}: missing {sorted(missing)}')
              lang=d['language']
              if lang not in {'es','en'} or p.parent.name != lang: raise SystemExit(f'{p}: bad language')
              if d['id'] in ids: raise SystemExit(f'{p}: duplicate id')
              ids.add(d['id'])
              pair=(int(d['article_number']),lang)
              if pair in pairs: raise SystemExit(f'{p}: duplicate article/language')
              pairs.add(pair)
              if not d['content_html'].strip(): raise SystemExit(f'{p}: empty content')
          for n in range(1,151):
              for lang in ('es','en'):
                  if (n,lang) not in pairs: raise SystemExit(f'missing pair {(n,lang)}')
          print(f'Validated {len(files)} JSON files and bilingual pairs 1–150')
          PY
          python3 content/tools/quality-audit-071-150.py | tee /tmp/quality-audit-after.log
          if grep -E 'META_TRUNCATED|GENERIC_INTENT|GENERIC_IMAGE' /tmp/quality-audit-after.log; then
            echo 'Residual metadata quality flags found.'
            exit 1
          fi

      - name: Remove temporary audit tooling
        run: |
          rm -f content/tools/quality-audit-071-150.py
          rm -f content/tools/quality-uplift-071-150.py
          rm -f .github/workflows/quality-audit-071-150.yml
          rm -f .github/workflows/quality-uplift-071-150.yml

      - name: Commit quality audit fixes
        run: |
          git config user.name 'HOME editorial audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and polish HOME articles 071-150 [skip ci]'
          git push origin HEAD:quality-audit-071-150
