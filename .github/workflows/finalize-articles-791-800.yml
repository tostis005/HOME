name: Finalize HOME articles 791-800

on:
  push:
    branches:
      - quality-audit-791-800

permissions:
  contents: write

jobs:
  generate-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: quality-audit-791-800
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply manual QA fixes to editorial source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/tools/batch-791-800.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for e in data:
              if e['n']==795:
                  e['faq_sections']=[0,1,3]
              if e['n']==798:
                  e['sections'][3][2]='Vuelve a guardar la ropa solo cuando el armario y los objetos estén completamente secos. No presiones prendas contra una pared fría ni llenes cada hueco; deja circulación y controla la humedad durante las semanas siguientes para confirmar que el olor no regresa.'
                  e['sections'][3][3]='Return clothes only when both the closet and the items are completely dry. Do not press clothing against a cold wall or fill every gap; leave airflow and monitor humidity over the following weeks to confirm the odor does not return.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Generate and validate
        run: python content/tools/generate-validate-791-800.py
      - name: Validate generated files independently
        run: python content/tools/generate-validate-791-800.py --validate-only
      - name: Commit generated articles and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tools/batch-791-800.json content/articles/es content/articles/en content/articles/QUALITY-AUDIT-791-800.md
          if ! git diff --cached --quiet; then
            git commit -m "Refine and validate HOME articles 791-800"
            git push origin HEAD:quality-audit-791-800
          fi
      - name: Validate committed working tree again
        run: python content/tools/generate-validate-791-800.py --validate-only
