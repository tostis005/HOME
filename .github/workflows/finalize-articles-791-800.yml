name: Finalize HOME articles 791-800

on:
  push:
    branches:
      - quality-audit-791-800

permissions:
  contents: write

jobs:
  generate-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: quality-audit-791-800
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final editorial QA rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('content/tools/batch-791-800.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for e in data:
              if e['n']==795:
                  e['faq_sections']=[0,1,3]
              if e['n']==798:
                  e['sections'][3][2]='Vuelve a guardar la ropa solo cuando el armario y los objetos estén completamente secos. No presiones prendas contra una pared fría ni llenes cada hueco; deja circulación y controla la humedad durante las semanas siguientes para confirmar que el olor no regresa.'
                  e['sections'][3][3]='Return clothes only when both the closet and the items are completely dry. Do not press clothing against a cold wall or fill every gap; leave airflow and monitor humidity over the following weeks to confirm the odor does not return.'
              if e['n']==800:
                  e['kind']='identification-guide'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          g=Path('content/tools/generate-validate-791-800.py')
          text=g.read_text(encoding='utf-8')
          text=text.replace(
              "if lang=='es':\n  if e['kind']=='diagnostics']:",
              "if lang=='es':\n  if e['kind']=='identification-guide': return 'Determinar si el filtro de la calefacción está sucio mediante señales observables, comprobarlo de forma segura y saber qué hacer después.'\n  if e['kind']=='diagnostics']:"
          )
          # Apply against the actual source form used by the generator.
          text=text.replace(
              "if lang=='es':\n  if e['kind']=='diagnostics':",
              "if lang=='es':\n  if e['kind']=='identification-guide': return 'Determinar si el filtro de la calefacción está sucio mediante señales observables, comprobarlo de forma segura y saber qué hacer después.'\n  if e['kind']=='diagnostics':"
          )
          text=text.replace(
              "if e['kind']=='diagnostics': return f'Identify the most likely causes behind “{q},” use distinguishing clues, and decide what to check first and when to get help.'",
              "if e['kind']=='identification-guide': return 'Determine whether a furnace filter is dirty using observable signs, check safely, and know what to do next.'\n if e['kind']=='diagnostics': return f'Identify the most likely causes behind “{q},” use distinguishing clues, and decide what to check first and when to get help.'"
          )
          g.write_text(text,encoding='utf-8')
          PY
      - name: Generate and validate
        run: python content/tools/generate-validate-791-800.py
      - name: Validate generated files independently
        run: python content/tools/generate-validate-791-800.py --validate-only
      - name: Commit generated articles and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tools/batch-791-800.json content/articles/es content/articles/en content/articles/QUALITY-AUDIT-791-800.md
          if ! git diff --cached --quiet; then
            git commit -m "Finalize HOME articles 791-800"
            git push origin HEAD:quality-audit-791-800
          fi
      - name: Validate committed working tree again
        run: python content/tools/generate-validate-791-800.py --validate-only
