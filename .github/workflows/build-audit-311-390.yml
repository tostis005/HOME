name: Build and audit HOME articles 311-390

on:
  push:
    branches:
      - quality-audit-311-390

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: quality-audit-311-390
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply terminology preflight
        run: python content/tools/preflight-311-390.py

      - name: Generate and audit articles
        run: python content/tools/build-311-390.py

      - name: Humanize FAQ questions
        run: python content/tools/humanize-faq-311-390.py

      - name: Validate final files
        run: python content/tools/validate-output-311-390.py

      - name: Commit generated articles and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en content/articles/QUALITY-AUDIT-311-390.md
          git diff --cached --quiet && exit 0
          git commit -m "Generate and validate HOME articles 311-390 [skip ci]"
          git push origin HEAD:quality-audit-311-390

      - name: Re-run final validator on committed state
        run: python content/tools/validate-output-311-390.py
