name: Build and audit HOME articles 231-310

on:
  push:
    branches:
      - quality-audit-231-310

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: quality-audit-231-310
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate articles
        run: python content/tools/build-231-310.py

      - name: Commit generated articles and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en content/articles/QUALITY-AUDIT-231-310.md
          git diff --cached --quiet && exit 0
          git commit -m "Generate and validate HOME articles 231-310 [skip ci]"
          git push origin HEAD:quality-audit-231-310

      - name: Re-run validator on committed state
        run: python content/tools/build-231-310.py
