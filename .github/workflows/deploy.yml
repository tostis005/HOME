name: Deploy HOME theme to WordPress

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'content/**'
      - 'docs/**'
      - 'platform/**'
      - '.github/**'
      - 'AGENTS.md'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: home-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate WordPress theme
        shell: bash
        run: |
          set -euo pipefail
          test -f style.css
          test -f functions.php
          find . -type f -name '*.php' -not -path './content/*' -not -path './docs/*' -not -path './platform/*' -print0 | xargs -0 -r -n1 php -l

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/home_deploy_key
          chmod 600 ~/.ssh/home_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Test VPS and HOME container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/home_deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -e
            if docker inspect home-wp >/dev/null 2>&1; then
              docker inspect home-wp >/dev/null
            elif sudo -n docker inspect home-wp >/dev/null 2>&1; then
              sudo -n docker inspect home-wp >/dev/null
            else
              echo "ERROR: No se puede acceder al contenedor home-wp con docker ni sudo docker."
              exit 1
            fi
          '

      - name: Package HOME theme
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./content' \
            --exclude='./docs' \
            --exclude='./platform' \
            --exclude='./AGENTS.md' \
            --exclude='./README.md' \
            -czf /tmp/home-theme.tar.gz .

      - name: Upload theme package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/home_deploy_key /tmp/home-theme.tar.gz "$VPS_USER@$VPS_HOST:/tmp/home-theme-${GITHUB_RUN_ID}.tar.gz"

      - name: Deploy into home-wp container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/home_deploy_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          ARCHIVE="/tmp/home-theme-${GITHUB_RUN_ID}.tar.gz"
          STAGE="/tmp/home-theme-${GITHUB_RUN_ID}"
          TARGET="/var/www/html/wp-content/themes/home"

          cleanup() {
            rm -rf "$ARCHIVE" "$STAGE" /tmp/home-wordpress.htaccess
          }
          trap cleanup EXIT

          if docker inspect home-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect home-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: No se puede administrar el contenedor home-wp."
            exit 1
          fi

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          "${DOCKER[@]}" exec home-wp sh -lc "rm -rf '$TARGET' && mkdir -p '$TARGET'"
          "${DOCKER[@]}" cp "$STAGE/." "home-wp:$TARGET/"
          "${DOCKER[@]}" exec home-wp sh -lc "chown -R www-data:www-data '$TARGET' && find '$TARGET' -type d -exec chmod 755 {} + && find '$TARGET' -type f -exec chmod 644 {} +"

          "${DOCKER[@]}" exec home-wp sh -lc "test -s '$TARGET/style.css' && test -s '$TARGET/functions.php' && test -s '$TARGET/assets/css/home-v2.css' && test -s '$TARGET/assets/generated/hero-living-room-v2.jpg' && test -s '$TARGET/assets/generated/home-category-sprite-v2.jpg'"
          "${DOCKER[@]}" exec home-wp php -r '$expect=["/var/www/html/wp-content/themes/home/assets/generated/hero-living-room-v2.jpg"=>[960,640],"/var/www/html/wp-content/themes/home/assets/generated/home-category-sprite-v2.jpg"=>[1040,390]]; foreach($expect as $f=>$dims){$i=@getimagesize($f); if(!$i){fwrite(STDERR,"Invalid image: $f\n"); exit(1);} if($i[0]!==$dims[0] || $i[1]!==$dims[1]){fwrite(STDERR,"Unexpected dimensions for $f\n"); exit(1);}}'

          # Apache must forward every pretty URL to WordPress. The production
          # container previously had an empty WordPress .htaccess block.
          cat > /tmp/home-wordpress.htaccess <<'HTACCESS'
          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          HTACCESS
          "${DOCKER[@]}" cp /tmp/home-wordpress.htaccess home-wp:/var/www/html/.htaccess
          "${DOCKER[@]}" exec home-wp sh -lc 'chown www-data:www-data /var/www/html/.htaccess && chmod 644 /var/www/html/.htaccess'

          "${DOCKER[@]}" exec home-wp php -r 'require "/var/www/html/wp-load.php"; if(function_exists("home_ensure_core_categories")){home_ensure_core_categories();} flush_rewrite_rules(false); echo "PERMALINK_STRUCTURE=".get_option("permalink_structure")."\n";'
          "${DOCKER[@]}" exec home-wp sh -lc 'apache2ctl -M 2>/dev/null | grep rewrite >/dev/null; test -s /var/www/html/.htaccess'

          if command -v curl >/dev/null 2>&1; then
            curl --fail --silent --show-error --max-time 10 -o /dev/null "http://127.0.0.1:8081/wp-content/themes/home/assets/css/home-v2.css?v=6"
            curl --fail --silent --show-error --max-time 10 -o /dev/null "http://127.0.0.1:8081/wp-content/themes/home/assets/generated/hero-living-room-v2.jpg?v=6"
            curl --fail --silent --show-error --max-time 10 -o /dev/null "http://127.0.0.1:8081/wp-content/themes/home/assets/generated/home-category-sprite-v2.jpg?v=6"

            for path in \
              "/" "/en/" \
              "/categoria/limpieza/" "/categoria/cocina/" "/categoria/bano/" "/categoria/lavanderia/" \
              "/categoria/electrodomesticos/" "/categoria/fontaneria/" "/categoria/plagas/" "/categoria/climatizacion/" \
              "/en/category/cleaning/" "/en/category/kitchen/" "/en/category/bathroom/" "/en/category/laundry/" \
              "/en/category/appliances/" "/en/category/plumbing/" "/en/category/pests/" "/en/category/heating-cooling/"
            do
              echo "Smoke test ${path}"
              body="$(curl --fail --silent --show-error --max-time 15 "http://127.0.0.1:8081${path}")"
              case "$path" in
                /en/*|/en/) expected="home-lang-en" ;;
                *) expected="home-lang-es" ;;
              esac
              printf '%s' "$body" | grep -q "$expected" || { echo "Wrong language shell for ${path}: expected ${expected}"; exit 1; }
            done

            # Validate EVERY currently published article, not just a sample. Any
            # new broken slug or language prefix will make the deployment fail.
            PUBLISHED_ARTICLES="$("${DOCKER[@]}" exec home-wp php -r '
              require "/var/www/html/wp-load.php";
              $posts=get_posts(["post_type"=>"post","post_status"=>"publish","posts_per_page"=>-1,"orderby"=>"ID","order"=>"ASC","suppress_filters"=>true]);
              foreach($posts as $post){
                $lang=get_post_meta($post->ID,"_home_language",true)==="en" ? "en" : "es";
                echo $lang."\t".$post->post_name."\n";
              }
            ')"

            ARTICLE_COUNT=0
            ES_COUNT=0
            EN_COUNT=0
            while IFS=$'\t' read -r lang slug; do
              [ -z "$slug" ] && continue
              ARTICLE_COUNT=$((ARTICLE_COUNT + 1))
              if [ "$lang" = "en" ]; then
                EN_COUNT=$((EN_COUNT + 1))
                path="/en/${slug}/"
                expected="home-lang-en"
              else
                ES_COUNT=$((ES_COUNT + 1))
                path="/${slug}/"
                expected="home-lang-es"
              fi
              echo "Article URL test ${lang}: ${path}"
              body="$(curl --fail --silent --show-error --max-time 15 "http://127.0.0.1:8081${path}")"
              printf '%s' "$body" | grep -q "$expected" || { echo "Wrong language shell for article ${path}: expected ${expected}"; exit 1; }
            done <<< "$PUBLISHED_ARTICLES"
            echo "ARTICLE_URLS_OK total=${ARTICLE_COUNT} es=${ES_COUNT} en=${EN_COUNT}"
          fi

          echo "HOME desplegado correctamente en home-wp:$TARGET"
          REMOTE
