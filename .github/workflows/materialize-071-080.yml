name: Materialize HOME articles 071-080

on:
  push:
    branches:
      - main
    paths:
      - 'content/.staging/home-071-080.tar.xz'
      - '.github/workflows/materialize-071-080.yml'

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize and validate article batch
        id: batch
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="content/.staging/home-071-080.tar.xz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Staging archive is no longer present."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The staging file is Base64 text containing the original XZ archive.
          base64 --decode "$ARCHIVE" > /tmp/home-071-080.tar.xz
          xz -t /tmp/home-071-080.tar.xz
          tar -xJf /tmp/home-071-080.tar.xz

          python3 - <<'PY'
          import json
          from pathlib import Path

          required = {
              'schema_version','id','article_number','translation_group','language',
              'locale','market_context','title','slug','seo','excerpt','taxonomy',
              'content_html','faq','sources','image','status'
          }
          pairs = {}
          for lang in ('es','en'):
              selected = []
              for path in sorted(Path('content/articles', lang).glob('*.json')):
                  data = json.loads(path.read_text(encoding='utf-8'))
                  if 71 <= int(data.get('article_number', 0)) <= 80:
                      missing = required - data.keys()
                      assert not missing, (path, missing)
                      assert data['language'] == lang, path
                      assert data['status'] == 'publish', path
                      assert data['content_html'].strip(), path
                      selected.append((path, data))
                      pairs[(data['article_number'], lang)] = data['translation_group']
              assert len(selected) == 10, (lang, len(selected))
          for n in range(71, 81):
              assert pairs[(n,'es')] == pairs[(n,'en')], (
                  n, pairs.get((n,'es')), pairs.get((n,'en'))
              )
          print("Validated HOME articles 071-080 in ES and EN")
          PY

          rm -f "$ARCHIVE"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Commit article JSON
        if: steps.batch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en content/.staging
          git commit -m "Add HOME articles 071-080 in ES and EN"
          git push

      - name: Dispatch production import for 071-080
        if: steps.batch.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run import-articles.yml \
            --ref main \
            -f language=all \
            -f from=71 \
            -f to=80 \
            -f status=json \
            -f force=false
          echo "Dispatched production import for articles 071-080."
