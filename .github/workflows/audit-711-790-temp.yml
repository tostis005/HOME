name: Temporary HOME 711-790 generation audit

on:
  push:
    branches:
      - quality-audit-711-790
    paths:
      - '.github/workflows/audit-711-790-temp.yml'
      - 'content/tools/generate-validate-711-790.py'
      - 'content/tools/batch-711-720.json'
      - 'content/tools/batch-721-730.json'
      - 'content/tools/batch-731-740.json'
      - 'content/tools/batch-741-750.json'
      - 'content/tools/batch-751-760.json'
      - 'content/tools/batch-761-770.json'
      - 'content/tools/batch-771-780.json'
      - 'content/tools/batch-781-790.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality-audit-711-790
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize temporary generator inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          script = Path('content/tools/generate-validate-711-790.py')
          s = script.read_text(encoding='utf-8')
          s = s.replace("children's reach.", "children reach.")
          script.write_text(s, encoding='utf-8')

          topics = {}
          for line in Path('content/topics/TOPICS-701-800.md').read_text(encoding='utf-8').splitlines():
              m = re.match(r'^(\d+)\.\s+(.+)$', line.strip())
              if m:
                  topics[int(m.group(1))] = m.group(2).strip()

          for start in range(711, 791, 10):
              p = Path(f'content/tools/batch-{start}-{start+9}.json')
              rows = json.loads(p.read_text(encoding='utf-8'))
              for row in rows:
                  if row['n'] in topics:
                      row['es_title'] = topics[row['n']]
                  if row['n'] == 769:
                      row['intro_en'] = "Bites alone do not confirm bed bugs, so early detection depends on finding physical evidence around sleeping areas. Look for live bugs, dark fecal spots, small rusty stains, eggs, and shed skins around mattress seams, the box spring, headboard, and nearby cracks. The U.S. Environmental Protection Agency (EPA) notes that low-level infestations are harder to find but much easier to manage when identified early."
                  if row['n'] == 722:
                      row['sections'][2][3] = "Tricks that involve spinning a fan with an object or trying to override electrical control components expose you to moving parts and stored energy. A swollen capacitor or stalled motor requires diagnosis with the equipment isolated by a competent technician."
              p.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m py_compile content/tools/generate-validate-711-790.py
      - name: Generate and validate 711-790
        run: python content/tools/generate-validate-711-790.py
      - name: Commit generated articles and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/es content/articles/en content/articles/QUALITY-AUDIT-711-790.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate and validate HOME articles 711-790'
            git push origin HEAD:quality-audit-711-790
          fi
