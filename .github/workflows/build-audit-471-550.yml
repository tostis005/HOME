name: Build and audit HOME articles 471-550

on:
  push:
    branches:
      - quality-audit-471-550
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: quality-audit-471-550
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runner-only validator correction
        run: sed -i "s/'desenchúfalo'/'desenchufa'/g" content/tools/generate-validate-471-550.py
      - name: Generate and validate article JSON
        run: python content/tools/generate-validate-471-550.py
      - name: Commit generated articles and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en content/articles/QUALITY-AUDIT-471-550.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate and validate HOME articles 471-550 [skip ci]"
          git push origin HEAD:quality-audit-471-550
      - name: Revalidate committed article state
        run: python content/tools/generate-validate-471-550.py --validate-only --no-report
