name: Stabilize HOME meta 551-630

on:
  push:
    branches: [stabilize-meta-551-630]
    paths:
      - 'content/tools/fix-meta-551-630.py'
      - '.github/workflows/stabilize-meta-551-630.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize-meta-551-630
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix and validate meta descriptions
        run: python content/tools/fix-meta-551-630.py
      - name: Commit stabilized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/en content/articles/es content/articles/QUALITY-AUDIT-551-630.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Stabilize HOME 551-630 meta descriptions"
            git push origin HEAD:stabilize-meta-551-630
          fi
