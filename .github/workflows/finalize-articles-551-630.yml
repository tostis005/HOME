name: Finalize HOME articles 551-630

on:
  push:
    branches:
      - quality-audit-551-630
    paths:
      - 'content/tools/batch-*.json'
      - 'content/tools/generate-validate-551-630.py'
      - '.github/workflows/finalize-articles-551-630.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: quality-audit-551-630
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize temporary validator and source mappings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content/tools/generate-validate-551-630.py')
          s = p.read_text(encoding='utf-8')

          old = 'not any(exp in text for exp in expansions)'
          new = 'not any(exp.lower() in text.lower() for exp in expansions)'
          if old not in s:
              raise SystemExit('Expected acronym validator expression not found')
          s = s.replace(old, new)

          marker = 'SOURCE_MAP = {\n'
          if marker not in s:
              raise SystemExit('Expected SOURCE_MAP marker not found')
          injection = '''SOURCE_MAP = {
    "gas": {
        "name": "U.S. Consumer Product Safety Commission — Winter Weather Safety Tips",
        "url": "https://www.cpsc.gov/Newsroom/News-Releases/2026/CPSC-Issues-Winter-Weather-Safety-Tips-to-Prevent-Fires-and-Carbon-Monoxide-Poisoning",
        "es_note": "Ante olor o sonido de una posible fuga de gas, salir de la vivienda y contactar al servicio de gas o emergencias desde fuera, evitando accionar dispositivos eléctricos antes de salir.",
        "en_note": "If a gas leak is smelled or heard, leave the home and contact local gas authorities from outside without operating electronics before leaving."
    },
    "water_softener": {
        "name": "U.S. Environmental Protection Agency WaterSense — Cation Exchange Water Softeners",
        "url": "https://www.epa.gov/watersense/cation-exchange-water-softeners",
        "es_note": "Funcionamiento, regeneración, consumo de sal y agua y mantenimiento de descalcificadores domésticos de intercambio catiónico.",
        "en_note": "How cation-exchange water softeners work, regenerate, use salt and water, and can be maintained efficiently."
    },
'''
          s = s.replace(marker, injection, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate and validate
        run: python content/tools/generate-validate-551-630.py

      - name: Validate generated files again
        run: python content/tools/generate-validate-551-630.py --validate-only

      - name: Commit generated articles and audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/articles/es content/articles/en content/articles/QUALITY-AUDIT-551-630.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate and validate HOME articles 551-630"
            git push origin HEAD:quality-audit-551-630
          fi
